<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link href="https://nycdob.github.io/FacadeSafetyReport/build/nv.d3.css" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Merriweather+Sans&display=swap" rel="stylesheet"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.4.9/d3.min.js"></script>
    <script src="https://nycdob.github.io/ActiveNB_A1enlargements/build/nv.d3.js"></script>
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script> -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <style>
      text {
        font: 13px sans-serif;
      }
      svg {
        display: block;
      }
      html,
      body,
       #chart1, 
       svg { 
         margin: 0px; 
         padding: 0px; 
         height: 100%; 
         width: 100%; 
       } 

      .tbl {
        display: flex;
        justify-content: flex-end;
        padding: 5px 0;
        margin: auto 15px;
      }
      .aspan {
		display: inline-block;
        width: 30em;
		border: 1px solid #eeeeee;
		background-color: #eeeeee;
		text-align: center;
      }
      .aspanHead {
        font-family: "Merriweather Sans", sans-serif;
        font-weight: 100;
        width: 30em;
		text-align: left;
		border: 1px solid #eeeeee;
		background-color: #eeeeee;
      }
      .colhead {
        font-family: "Merriweather Sans", sans-serif;
        font-weight: 100;
        width: 30em;
		text-align: center;
      }
    </style>
  </head>
  <body>
    <script>
      $(document).ready(function () {
        var points = [];
        let cycles = new Map();
        // d3.csv("data/FacadeStatusAllCycles.csv", function (data) {
	      d3.csv("https://raw.githubusercontent.com/NYCDOB/FacadeSafetyReport/gh-pages/data/FacadeStatusAllCycles.csv", function (data) {
          points = data.map(function (d) {
            d.cycle = parseInt(d.Cycle.substring(0, 2));
            d.status = d["CN Filing Status"];
            return d;
          });
          var cycleOrder = [
            "SAFE",
            "SWARMP",
            "SWARMP (EXPIRED)",
            "UNSAFE",
            "NO REPORT FILED",
            "ONGOING MAINTENANCE",
            "PRECAUTIONARY",
          ];
          cycles=[4,5,6,7,8,9,10];
          const cycleTotals = cycles.reduce((acc, cycle) => {
            acc[cycle] = points.filter(d => d.cycle === cycle).length;
            return acc;
          }, {});
        function formatPercent(count, total) {
          if (total === 0) return 0;
          const raw = (count / total) * 100;
          if (raw > 0 && raw < 1) return "< 1";
          const whole = Math.floor(raw);
          const decimal = raw - whole;
          return decimal < 0.5 ? whole : whole + 1;
        }
        let rawCounts = cycleOrder.map(status => {
              const row = {};
              row.status=status;
                            cycles.forEach(cycle => {
                              row[cycle] = data.filter(
                                d => d.status === status && d.cycle === cycle
                              ).length;
                            });
                            return row;

              });
        let pivotPercent = cycleOrder.map(status => {
          const row = { status };
          cycles.forEach(cycle => {
            const count = data.filter(
              d => d.status === status && d.cycle === cycle
            ).length;
            const total = cycleTotals[cycle];
            row[`Cycle ${cycle}`] = formatPercent(count, total);
          });
          return row;
        });
          let fr = new DocumentFragment();
          d1 = document.createElement("div");
          d1.className = "tbl";
          colhead = document.createElement("span");
          colhead.className = "colhead";
          colhead.textContent = "";
          d1.appendChild(colhead);
          for (e of ["CYCLE 4","CYCLE 5","CYCLE 6","CYCLE 7","CYCLE 8","CYCLE 9","CYCLE 10"]) {
            colhead = document.createElement("span");
            colhead.className = "colhead";
            colhead.textContent = e;
            d1.appendChild(colhead);
          }
          fr.appendChild(d1);
          pivotPercent.forEach((e) => {
            d1 = document.createElement("div");
            d1.className = "tbl";
            linehead = document.createElement("span");
            linehead.className = "aspanHead";
            linehead.textContent = e.status;
            d1.appendChild(linehead);
            cycles.forEach((c) => {
              let aSpan = document.createElement("span");
              aSpan.className = "aspan";
              let lit="";
              lit +=(e[`Cycle ${c}`] >= 1 || e[`Cycle ${c}`] == 0 ? " " + e[`Cycle ${c}`] + "%" : " <1%") ;
              aSpan.textContent = lit;
              aSpan.title = rawCounts.find ( x =>    x.status==e.status     )[c]
              d1.appendChild(aSpan);
            });
            fr.appendChild(d1);
          });
          document.querySelector("body").appendChild(fr);
        });
      });
    </script>
  </body>
</html>
